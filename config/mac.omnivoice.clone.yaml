# MacBook (Apple Silicon). TTS = OmniVoice w trybie KLONU (stała barwa głosu). STT parakeet-tdt (MLX).
# Próbka referencyjna: assets/ref_pl_F3.wav (syntetyczny głos Supertonic F3) -> skopiuj do ~/speech-to-speech/ref/
schema_version: 1
blocks:
  vad: {kind: vad, backend: silero}
  stt:
    kind: stt
    backend: parakeet-tdt
  llm:
    kind: llm
    backend: chat-completions
    settings:
      model_name: conduit
      responses_api_base_url: "ADRES_Z_CONDUITA"
      responses_api_api_key: "KLUCZ_Z_CONDUITA"
      stream_batch_sentences: 1
  tts:
    kind: tts
    backend: omnivoice
    settings:
      omnivoice_device: mps
      omnivoice_dtype: float16
      omnivoice_language: Polish
      omnivoice_ref_audio: ref/ref_pl_F3.wav
      omnivoice_ref_text: "Cześć! Pewnie, mogę ci w tym pomóc. Zajrzałem do kalendarza i na jutro masz tylko jedno spotkanie."
      omnivoice_num_steps: 16
pipelines:
  mac:
    options:
      mac_optimal_settings: true
    stages: {vad: vad, stt: stt, llm: llm, tts: tts}
    num_pipelines: 2
runtime:
  server:
    host: 0.0.0.0
    port: 8765
