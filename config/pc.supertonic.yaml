# CachyOS + Radeon RX 9070 XT. TTS = Supertonic 3 (ONNX, szybki i stabilny,
# rynek PL WER 0% na prozie w testach 2026-10). STT nadal parakeet-tdt na GPU.
schema_version: 1
blocks:
  vad: {kind: vad, backend: silero}
  stt:
    kind: stt
    backend: parakeet-tdt
    settings:
      parakeet_tdt_device: cuda
  llm:
    kind: llm
    backend: chat-completions
    settings:
      model_name: conduit
      responses_api_base_url: "ADRES_Z_CONDUITA"
      responses_api_api_key: "KLUCZ_Z_CONDUITA"
      stream_batch_sentences: 1
  tts:
    kind: tts
    backend: supertonic
    settings:
      supertonic_tts_voice: F1     # F1-F5 zenskie, M1-M5 meskie
      supertonic_tts_lang: pl      # 'na' = auto z rozpoznania STT
      supertonic_tts_speed: 1.0
pipelines:
  pc:
    stages: {vad: vad, stt: stt, llm: llm, tts: tts}
    num_pipelines: 2
runtime:
  server:
    host: 0.0.0.0
    port: 8765
